# couplerParams.toml
#
# FastEddy GIS Prep parameter file.

## - Domain description - ##
# Enter domain description parameters.

# Domain name
domain_name = 'domain_10kmx10km'
# Longitude of origin (decimal degrees E)
lon_0 = -105.24192
# Latitude of origin (decimal degrees N)
lat_0 = 40.03757
# Domain height (meters)
domain_height = 10000
# Domain width (meters)
domain_width = 10000
# Cell size (meters)
cell_size = 10
# Building height level of detail (LOD)
# LOD 0 (default): single height per footprint; LOD 1: single height per cell
# Only referenced if LiDAR Point Cloud used to derive heights
lod = 0
# Building height filters (experimental)
# strict (default): additional "spike" control; loose: 90th percentile threshold only
height_filters = 'strict'

## - ##

## - Data paths - ##

# Path to store domain datasets
# Logs will write to the same folder
base_path = '/path/to/output/directory'

# - Mandatory datasets - #

# Elevation
# These are stored as tiles. The default url below can be queried for data falling with the domain.
elev_url = 'https://tnmaccess.nationalmap.gov/api/v1/products'

# NLCD
# This is a CONUS dataset. Code will download and unzip from the default url below.
# Optionally, point to a local copy.
nlcd_url = 'https://www.mrlc.gov/downloads/sciweb1/shared/mrlc/data-bundles/Annual_NLCD_LndCov_2024_CU_C1V1.zip'
# nlcd_url = '/path/to/local/copy'

# - #

# - Optional datasets. To exclude, enter an empty string (''). - #

# Buildings footprints
# Overture maps include building heights in their dataset. This url plus internal code is set up to find the latest release.
buildings_fp_url = ''
# buildings_fp_url = 's3://overturemaps-us-west-2/release'

# Lidar Point Cloud
# When included, will attempt to use the lidar point cloud to generate building heights.
lidar_url = ''
# lidar_url = 'https://tnmaccess.nationalmap.gov/api/v1/products'

# POLARIS soil properties (Chaney et al. 2019, WRR; 30 m, CONUS only)
# When included, downloads the 1 x 1 degree tiles covering the domain and writes the variables per depth interval
# (dimension soil_depth, with soil_depth_top/bottom in m) to the NetCDF file, e.g. sand/silt/clay (%) for the
# FastEddy land-surface model soil texture classes (GeoSpec.py soil_opt).
polaris_url = ''
# polaris_url = 'http://hydrology.cee.duke.edu/POLARIS/PROPERTIES/v1.0'
polaris_vars = ['sand', 'silt', 'clay']
polaris_stat = 'mean'
polaris_depths = ['0_5', '5_15', '15_30', '30_60', '60_100', '100_200']

# - #

## - ##